name: Siprup
options:
  bundleIdPrefix: com.kengomes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Siprup:
    type: application
    platform: iOS
    sources: [Siprup]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kengomes.siprup
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Siprup
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SiprupTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SiprupTests]
    dependencies:
      - target: Siprup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Siprup.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Siprup"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Siprup:
    build:
      targets:
        Siprup: all
        SiprupTests: [test]
    test:
      targets: [SiprupTests]
    run:
      config: Debug
